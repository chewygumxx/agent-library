# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/agent-library.git
# ::: :/mise.toml
#
#

#
# Sourced during CI by GitHub Action `jdx/mise-action`
# https://mise.jdx.dev/configuration.html
#

# ----------
# Intrinsic
# ----------

min_version = "2026.9.0"

# ------
# Tools
# ------

[tools]
# Javascript/TypeScript Runtime
bun = "1.4"

# Publication to NPM Registry.
node = "24"

# -----------------------
# Tools: Lint and Format
# -----------------------

# editorconfig
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# TOML
"aqua:tombi-toml/tombi" = "1.5.5"

# Shell
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

# YAML
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

# GitHub Actions
"aqua:rhysd/actionlint" = "1.7.12"

# ------
# Tasks
# ------

[tasks.install]
description = "Install the locked bun dependency tree"
alias       = "i"
run         = "bun ci"

[tasks.lint]
description = "Lint with Biome alone; `check` runs every check CI runs"
alias       = "l"
run         = "bun run lint"

[tasks.check]
description = "Run every check CI runs"
alias       = "c"
run         = "bun run check"

[tasks.test]
description = "Run the project's tests"
alias       = "t"
run         = "bun test"

# Wrapper to refresh remote task data upon every execution.
[tasks.act]
description = "Locally execute GitHub Actions (CI) with Docker"
run         = "mise run --no-cache act-cached"
alias       = [
    "exec-ci",
    "exec-gh-act",
    "exec-gh-actions",
]

[tasks.act-cached]
description = "[Internal] Locally execute GitHub Actions (CI) with Docker"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"
hide        = true
# See README.md of `chewygumxx/.github` <https://github.com/chewygumxx/.github>
