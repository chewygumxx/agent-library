# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/agent-library.git
# ::: :/skills/configuring-mise-tasks/assets/tasks.toml
#
#

#
# Starting tasks, copied to .config/mise/tasks.toml. Replace each <...>,
# and repeat lint:<kind> and format:<kind> once per kind of file.
#

# ---------
# Standard
# ---------

[install]
description = "Install the locked dependency tree"
alias       = "i"
run         = "<locked install, such as bun ci>"

[lint]
description = "Run every linter and format check"
alias       = "l"
usage       = 'flag "--staged" help="Lint staged files alone"'
depends     = [
    "lint:<kind> {% if usage.staged %}--staged{% endif %}",
    "lint:types",
]

[format]
description = "Apply every formatter"
alias       = "f"
usage       = 'flag "--staged" help="Format staged files alone"'
depends     = [ "format:<kind> {% if usage.staged %}--staged{% endif %}" ]

[test]
description = "Run the tests"
alias       = "t"
sources     = [ "<tests and the code they test>", "<lockfile>", ".config/mise/config.toml" ]
outputs     = { auto = true }
run         = "<test command>"

[check]
description = "Run everything CI runs: lint and test"
alias       = "c"
usage       = 'flag "--staged" help="Lint staged files alone; test in full"'
depends     = [ "lint {% if usage.staged %}--staged{% endif %}", "test" ]

# --------------------
# Lint: file by file
# --------------------

["lint:<kind>"]
description = "Lint <kind> files with <linter>"
usage       = 'flag "--staged"'
sources     = [ "**/*.<ext>", "!node_modules/**", "<linter config>", "<lockfile>", ".config/mise/config.toml", "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}" ]
outputs     = { auto = true }
run         = "scripts/with-files.sh ${usage_staged:+--staged} '*.<ext>' -- <linter, check only>"

# ---------------------
# Lint: whole project
# ---------------------

["lint:types"]
description = "Type-check with <type checker>"
sources     = [ "<typed sources>", "!node_modules/**", "<type checker config>", "<lockfile>", ".config/mise/config.toml" ]
outputs     = { auto = true }
run         = "<type checker>"

["lint:commit"]
description = "Lint a commit message file with <commit linter>"
usage       = 'arg "<file>" help="The commit message file"'
run         = '<commit linter> "$usage_file"'

# -------
# Format
# -------

["format:<kind>"]
description = "Format <kind> files with <formatter>"
usage       = 'flag "--staged"'
run         = "scripts/with-files.sh ${usage_staged:+--staged} '*.<ext>' -- <formatter, writing>"
